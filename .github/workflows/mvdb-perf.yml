name: mvdb perf

# The MiniVectorDB performance benchmark in the shape of the official one.
# It gives the same relative picture on a linux runner, which is what the
# optimisation rounds need: every change is measured before and after.

on:
  push:
    branches:
      - ci/mvdb
  workflow_dispatch:
    inputs:
      rows:
        description: rows
        default: '10000'
      queries:
        description: topk queries
        default: '1000'

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.3 || echo "numpy is missing, the pure python path is measured"
      - name: Run the benchmark
        run: |
          python tools/mvdb_bench.py \
            --rows ${{ github.event.inputs.rows || '10000' }} \
            --queries ${{ github.event.inputs.queries || '1000' }} \
            --json bench.json
      - name: Show the report
        run: cat bench.json
      - name: Profile the query phase
        run: python tools/mvdb_query_profile.py --rows 10000 --queries 200
      - uses: actions/upload-artifact@v4
        with:
          name: mvdb-bench
          path: bench.json
